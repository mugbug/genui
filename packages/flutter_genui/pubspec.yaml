name: flutter_genui
description: Generates and displays generative user interfaces (GenUI) in Flutter using AI.
version: 0.4.0
homepage: https://github.com/flutter/genui/packages/flutter_genui
license: BSD-3-Clause
issue_tracker: https://github.com/flutter/genui/issues
publish_to: none

environment:
  sdk: ">=3.6.1 <4.0.0"
  flutter: ">=3.27.3 <4.0.0"

resolution: workspace

dependencies:
  collection: ^1.19.0
  flutter:
    sdk: flutter
  json_schema_builder:
    git:
      url: https://github.com/mugbug/genui.git
      ref: 3.273-v1
      path: packages/json_schema_builder
  logging: ^1.3.0

dev_dependencies:
  dart_flutter_team_lints: ^3.2.0
  flutter_test:
    sdk: flutter
  network_image_mock: ^2.1.1
